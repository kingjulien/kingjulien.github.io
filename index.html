<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koľko nás dnes v office</title>
<style>
  :root{
    --ink:#1a1f2b;
    --amber-1:#f0a839;
    --amber-2:#e8873c;
    --coral-1:#f0716a;
    --coral-2:#e2564f;
    --ok:#3ecf8e;
    --warn:#f5c744;
    --bad:#f0554f;
    --paper:#fff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.07), transparent 40%),
      linear-gradient(155deg, #23283a 0%, #1b1f2e 45%, #14171f 100%);
  }

  .card{
    position:relative;
    width:100%;
    max-width:620px;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
    background:
      linear-gradient(180deg, rgba(10,12,18,.35) 0%, rgba(10,12,18,.72) 68%, rgba(10,12,18,.86) 100%),
      repeating-linear-gradient(90deg, #2b3142 0 2px, #262b3a 2px 64px),
      linear-gradient(160deg, #3a4258, #20242f 70%);
  }

  /* faux office window strip, echoes the pool photo band in the reference */
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:46%;
    background-image:
      linear-gradient(180deg, rgba(20,23,33,0) 55%, rgba(15,17,25,.55) 100%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 46px, rgba(255,255,255,0) 46px 64px);
    pointer-events:none;
  }

  .content{
    position:relative;
    padding:34px 30px 30px;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#ffd9a0;
    background:rgba(255,255,255,.08);
    padding:6px 12px;
    border-radius:100px;
    margin-bottom:16px;
    border:1px solid rgba(255,255,255,.12);
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 4px rgba(62,207,142,.18);
  }

  h1{
    margin:0 0 26px;
    color:#fff;
    font-size:clamp(26px, 5vw, 36px);
    line-height:1.16;
    font-weight:800;
    letter-spacing:-.01em;
    text-shadow:0 2px 18px rgba(0,0,0,.35);
  }
  h1 .wave{ display:inline-block; }

  .panels{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 14px 34px -14px rgba(0,0,0,.5);
  }
  @media (max-width:520px){
    .panels{ grid-template-columns:1fr; }
  }

  .panel{
    padding:22px 20px;
    position:relative;
  }
  .panel.people{
    background:linear-gradient(160deg, var(--amber-1), var(--amber-2));
  }
  .panel.status{
    background:linear-gradient(160deg, var(--coral-1), var(--coral-2));
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .panel-label{
    color:rgba(255,255,255,.92);
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-label svg{ flex-shrink:0; opacity:.95; }

  .count-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .count-row svg{ flex-shrink:0; }

  .count-value{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-weight:800;
    color:#fff;
    font-size:clamp(30px, 6vw, 40px);
    line-height:1;
  }
  .count-value .sep{ opacity:.75; font-weight:700; font-size:.75em; }

  .editable{
    background:rgba(255,255,255,.16);
    border:1.5px dashed rgba(255,255,255,.55);
    border-radius:10px;
    padding:2px 8px;
    min-width:1.1em;
    text-align:center;
    outline:none;
    cursor:text;
    transition:background .15s ease, border-color .15s ease;
  }
  .editable:hover{ background:rgba(255,255,255,.24); }
  .editable:focus{ background:rgba(255,255,255,.3); border-color:#fff; }

  .hint{
    margin-top:10px;
    font-size:11.5px;
    color:rgba(255,255,255,.82);
    font-weight:600;
  }

  .status-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(255,255,255,.14);
    border-radius:12px;
    padding:10px 12px;
  }
  .status-left{
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
    font-weight:700;
    font-size:14px;
  }
  .status-left svg{ flex-shrink:0; }

  .status-pill{
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 11px;
    border-radius:100px;
    font-size:12px;
    font-weight:800;
    color:#1a1f2b;
    border:none;
    cursor:pointer;
    letter-spacing:.01em;
    transition:transform .12s ease, filter .12s ease;
    font-family:inherit;
  }
  .status-pill:hover{ transform:translateY(-1px); filter:brightness(1.03); }
  .status-pill:active{ transform:translateY(0); }
  .status-pill .pdot{
    width:7px;height:7px;border-radius:50%;
    background:#1a1f2b;
  }
  .status-pill[data-state="ok"]{ background:var(--ok); color:#0b3a26; }
  .status-pill[data-state="warn"]{ background:var(--warn); color:#4a3900; }
  .status-pill[data-state="bad"]{ background:var(--bad); color:#4a0d0a; }

  .footer-note{
    margin-top:16px;
    text-align:center;
    font-size:11.5px;
    color:rgba(255,255,255,.45);
  }
  .footer-note button{
    background:none;
    border:none;
    color:rgba(255,255,255,.7);
    text-decoration:underline;
    cursor:pointer;
    font-size:11.5px;
    font-family:inherit;
    padding:0;
  }
  .footer-note button:hover{ color:#fff; }
</style>
</head>
<body>

<div class="card">
  <div class="content">
    <div class="eyebrow"><span class="dot"></span>Live · dnes</div>
    <h1>Koľko nás dnes<br>v office <span class="wave">👋</span></h1>

    <div class="panels">
      <div class="panel people">
        <p class="panel-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Počet ľudí v office
        </p>
        <div class="count-row">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <div class="count-value">
            <span class="editable" id="peopleNow" contenteditable="true" spellcheck="false">7</span>
            <span class="sep">/</span>
            <span class="editable" id="peopleMax" contenteditable="true" spellcheck="false">18</span>
          </div>
        </div>
        <div class="hint">klikni na číslo a uprav ✏️</div>
      </div>

      <div class="panel status">
        <p class="panel-label" style="margin-bottom:2px;">Prevádzka</p>

        <div class="status-item">
          <div class="status-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Elektrina
          </div>
          <button class="status-pill" data-state="ok" data-key="electricity"><span class="pdot"></span><span class="ptext">OK</span></button>
        </div>

        <div class="status-item">
          <div class="status-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69s-5 6-5 10.5a5 5 0 0 0 10 0c0-4.5-5-10.5-5-10.5z"/></svg>
            Voda
          </div>
          <button class="status-pill" data-state="ok" data-key="water"><span class="pdot"></span><span class="ptext">OK</span></button>
        </div>

        <div class="status-item">
          <div class="status-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            Káva
          </div>
          <button class="status-pill" data-state="warn" data-key="coffee"><span class="pdot"></span><span class="ptext">Málo</span></button>
        </div>
      </div>
    </div>

    <div class="footer-note">Klikni na status a prepni stav · <button id="resetBtn" type="button">reset na predvolené</button></div>
  </div>
</div>

<script>
(function(){
  const STATES = {
    ok:   { label: "OK",     next: "warn" },
    warn: { label: "Málo",   next: "bad"  },
    bad:  { label: "Výpadok",next: "ok"   }
  };
  const DEFAULTS = {
    peopleNow: "7",
    peopleMax: "18",
    electricity: "ok",
    water: "ok",
    coffee: "warn"
  };

  const peopleNowEl = document.getElementById('peopleNow');
  const peopleMaxEl = document.getElementById('peopleMax');
  const pills = Array.from(document.querySelectorAll('.status-pill'));
  const resetBtn = document.getElementById('resetBtn');

  function applyPillState(pill, state){
    if(!STATES[state]) state = 'ok';
    pill.dataset.state = state;
    pill.querySelector('.ptext').textContent = STATES[state].label;
  }

  function sanitizeNumber(el){
    let v = el.textContent.replace(/[^0-9]/g,'');
    if(v === '') v = '0';
    v = String(parseInt(v,10));
    el.textContent = v;
    return v;
  }

  async function save(){
    const data = {
      peopleNow: peopleNowEl.textContent.trim(),
      peopleMax: peopleMaxEl.textContent.trim(),
      electricity: pills.find(p=>p.dataset.key==='electricity').dataset.state,
      water: pills.find(p=>p.dataset.key==='water').dataset.state,
      coffee: pills.find(p=>p.dataset.key==='coffee').dataset.state
    };
    try{
      if(window.storage){
        await window.storage.set('office-status', JSON.stringify(data), false);
      }
    }catch(e){ console.warn('Storage save failed', e); }
  }

  async function load(){
    let data = null;
    try{
      if(window.storage){
        const res = await window.storage.get('office-status', false);
        if(res && res.value) data = JSON.parse(res.value);
      }
    }catch(e){ /* no saved data yet */ }
    data = data || DEFAULTS;

    peopleNowEl.textContent = data.peopleNow ?? DEFAULTS.peopleNow;
    peopleMaxEl.textContent = data.peopleMax ?? DEFAULTS.peopleMax;
    pills.forEach(pill=>{
      const key = pill.dataset.key;
      applyPillState(pill, data[key] || DEFAULTS[key]);
    });
  }

  peopleNowEl.addEventListener('blur', ()=>{ sanitizeNumber(peopleNowEl); save(); });
  peopleMaxEl.addEventListener('blur', ()=>{ sanitizeNumber(peopleMaxEl); save(); });
  [peopleNowEl, peopleMaxEl].forEach(el=>{
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); el.blur(); }
    });
  });

  pills.forEach(pill=>{
    pill.addEventListener('click', ()=>{
      const cur = pill.dataset.state;
      const next = STATES[cur] ? STATES[cur].next : 'ok';
      applyPillState(pill, next);
      save();
    });
  });

  resetBtn.addEventListener('click', ()=>{
    peopleNowEl.textContent = DEFAULTS.peopleNow;
    peopleMaxEl.textContent = DEFAULTS.peopleMax;
    pills.forEach(pill=> applyPillState(pill, DEFAULTS[pill.dataset.key]));
    save();
  });

  load();
})();
</script>

</body>
</html>
